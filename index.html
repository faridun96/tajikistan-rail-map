<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Железные дороги Таджикистана — 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>

  <div class="left-col">
  <header class="panel title-card">
    <div class="eyebrow">Интерактивная 3D-схема</div>
    <h1>Железные дороги Таджикистана</h1>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="panel legend" id="legend">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Найти станцию…" autocomplete="off" />
      <div class="results" id="results"></div>
    </div>
    <div class="legend-head">
      <span>Участки</span>
      <button class="link-btn" id="showAll" hidden>Показать все</button>
    </div>
    <ul id="lines"></ul>
    <div class="legend-keys">
      <div><i class="k-station"></i>Станция</div>
      <div><i class="k-junction"></i>Узловая</div>
      <div><i class="k-border"></i>Сархад (граница)</div>
      <div><i class="k-train"></i>Поезд (анимация)</div>
    </div>
  </aside>
  </div>

  <section class="panel card" id="card" hidden>
    <button class="close" id="cardClose" aria-label="Закрыть">×</button>
    <div class="card-line" id="cardLine"></div>
    <h2 id="cardName"></h2>
    <div class="badges" id="cardBadges"></div>
    <dl id="cardFacts"></dl>
    <div class="neighbors" id="cardNeighbors"></div>
  </section>

  <div class="toolbar panel" id="toolbar">
    <div class="group">
      <button data-toggle="labels" class="on">Подписи</button>
      <button data-toggle="chain" class="on">Пикетаж</button>
      <button data-toggle="ticks" class="on">Км-отметки</button>
      <button data-toggle="relief" class="on">Рельеф</button>
      <button data-toggle="trains" class="on">Поезда</button>
    </div>
    <div class="group">
      <button data-view="3d">3D</button>
      <button data-view="top">Сверху</button>
      <button data-view="reset">Вся сеть</button>
    </div>
  </div>

  <div class="hud">
    <div class="compass" id="compass" title="Север"><div class="needle"></div><span>С</span></div>
    <div class="scalebar"><div class="bar" id="scaleBar"></div><span id="scaleText"></span></div>
  </div>

  <div class="hint" id="hint">Перетаскивание — сдвиг · Правая кнопка — поворот · Колесо — масштаб · Клик по станции — подробности</div>
  <div class="tooltip" id="tooltip"></div>
  <button class="panel legend-toggle" id="legendToggle">Участки</button>

  <script src="data.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
